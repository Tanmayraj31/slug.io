name: CD

on:
  push:
    branches: [dev]
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - '**.ts'
      - 'prisma/schema.prisma'
      - 'backend/package.json'
      - 'frontend/package.json'
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, dev]

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/dev' || success()
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.slug.io
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: Tanmayraj31
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull latest images from CI
        run: |
          docker pull ghcr.io/Tanmayraj31/slug.io/backend:${{ github.sha }}
          docker pull ghcr.io/Tanmayraj31/slug.io/frontend:${{ github.sha }}

      - name: Deploy staging stack
        run: |
          docker compose -f compose.yaml up -d --build

      - name: Run Prisma migrations (staging)
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Wait for health check
        run: |
          for i in {1..30}; do
            if curl -sf https://staging.slug.io/health/live; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Waiting for staging..."
            sleep 5
          done
          echo "Staging health check failed"
          exit 1

  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://slug.io
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Approval check
        if: github.event.review == null
        run: |
          echo "Waiting for production approval..."
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: Tanmayraj31
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull production image (SHA)
        run: |
          docker pull ghcr.io/Tanmayraj31/slug.io/backend:${{ github.sha }}
          docker pull ghcr.io/Tanmayraj31/slug.io/frontend:${{ github.sha }}

      - name: Deploy production stack
        run: |
          docker compose -f compose.prod.yaml up -d --build

      - name: Run Prisma production migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Wait for health check
        run: |
          for i in {1..30}; do
            if curl -sf https://slug.io/health/live; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Waiting for production..."
            sleep 5
          done
          echo "Production health check failed"
          exit 1